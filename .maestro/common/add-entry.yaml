appId: dev.offlinevault.app
---
- tapOn:
    id: add-entry
- tapOn:
    id: field-title
- inputText: GitHub
- tapOn:
    id: field-username
- inputText: octo@example.com
- tapOn:
    id: field-password
- inputText: s3cret-Pass!
- hideKeyboard
- scrollUntilVisible:
    element:
      id: save-entry
    direction: DOWN
    timeout: 15000
- tapOn:
    id: save-entry
- extendedWaitUntil:
    visible: GitHub
    timeout: 15000
