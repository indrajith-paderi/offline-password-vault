appId: dev.offlinevault.app
---
# On a busy emulator, Android sometimes kills the fresh process right after a
# clear-state relaunch ("Destroy timeout of remove-task"), leaving no app on screen.
# Relaunch when that happens instead of failing the flow.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
      - extendedWaitUntil:
          visible:
            id: create-vault
          timeout: 30000
- tapOn:
    id: create-vault
- runFlow: pin-1357.yaml
- runFlow: pin-1357.yaml
- extendedWaitUntil:
    visible:
      id: vault-list
    timeout: 40000
