appId: dev.offlinevault.app
name: Three wrong PINs lock the vault for an hour
---
- runFlow: common/create-vault.yaml
- runFlow: common/relaunch-locked.yaml
- runFlow: common/pin-0000.yaml
- extendedWaitUntil:
    visible: .*2 attempts left.*
    timeout: 20000
- runFlow: common/pin-0000.yaml
- extendedWaitUntil:
    visible: .*1 attempt left.*
    timeout: 20000
- runFlow: common/pin-0000.yaml
- extendedWaitUntil:
    visible: Too many wrong PINs.
    timeout: 20000
- assertVisible: .*Try again in about.*
- runFlow: common/relaunch-locked.yaml
- assertVisible: Too many wrong PINs.
- runFlow: common/pin-1357.yaml
- assertNotVisible:
    id: vault-list
