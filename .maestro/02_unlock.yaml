appId: dev.offlinevault.app
name: Wrong PIN is counted, right PIN unlocks
tags:
  - smoke
---
- runFlow: common/create-vault.yaml
- runFlow: common/add-entry.yaml
- runFlow: common/relaunch-locked.yaml
- assertNotVisible: GitHub
- runFlow: common/pin-0000.yaml
- extendedWaitUntil:
    visible: .*2 attempts left.*
    timeout: 20000
- runFlow: common/pin-1357.yaml
- extendedWaitUntil:
    visible: GitHub
    timeout: 20000
